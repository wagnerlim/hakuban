# Builds website/ and publishes it to GitHub Pages.
# Enable once in the repo: Settings → Pages → Source = "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/deploy-docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The doc video is not in git (12 MB against a 500 KB source tree). It comes from a
      # release and is copied into static/ so the published site serves it itself.
      - run: ./fetch-assets.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS_REPO: ${{ github.repository }}
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
