# One `git tag vX.Y.Z && git push --tags` publishes everywhere: GitHub Release (archives +
# checksums), the Homebrew tap and the Scoop bucket. Run by .github/workflows/release.yml.
# Local dry run, publishes nothing: goreleaser release --snapshot --clean
version: 2

project_name: hakuban

builds:
  - main: ./cmd/hakuban
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - {goos: windows, goarch: arm64}
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - {goos: windows, formats: [zip]}
    files: [LICENSE, README.md, CREDITS.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs", "^test", "^chore\\(website\\)"]

release:
  # The `assets` release only hosts the doc video (website/fetch-assets.sh); it must never
  # be "latest", or releases/latest stops pointing at a version.
  make_latest: true

# ponytail: `brews` (Formula) is deprecated in GoReleaser v2 in favour of homebrew_casks, but a
# Formula is what installs without the macOS quarantine flag on an unsigned binary and also
# works on Linux. Move to homebrew_casks when brews is removed.
brews:
  - repository:
      owner: wagnerlim
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://wagnerlim.github.io/hakuban/
    description: A terminal whiteboard where moving a card runs the automation you declared.
    license: MIT
    test: |
      system "#{bin}/hakuban", "version"

scoops:
  - repository:
      owner: wagnerlim
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://wagnerlim.github.io/hakuban/
    description: A terminal whiteboard where moving a card runs the automation you declared.
    license: MIT

# winget: the manifest goes to a fork (wagnerlim/winget-pkgs) and GoReleaser opens the PR
# to microsoft/winget-pkgs, where a bot validates it and a moderator merges. It needs
# WINGET_GITHUB_TOKEN, a *classic* PAT with public_repo: a fine-grained one cannot open a
# PR on a repo another owner holds. Without that secret the upload is skipped (a skip, not
# a failure), so the rest of the release stays green until winget is set up.
winget:
  - name: hakuban
    skip_upload: '{{ if isEnvSet "WINGET_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    publisher: wagnerlim
    package_identifier: wagnerlim.hakuban
    publisher_url: https://github.com/wagnerlim
    homepage: https://wagnerlim.github.io/hakuban/
    short_description: A terminal whiteboard where moving a card runs the automation you declared.
    license: MIT
    license_url: https://github.com/wagnerlim/hakuban/blob/main/LICENSE
    release_notes_url: "https://github.com/wagnerlim/hakuban/releases/tag/{{ .Tag }}"
    tags: [kanban, tui, terminal, cli, agents]
    repository:
      owner: wagnerlim
      name: winget-pkgs
      branch: "hakuban-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
